<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autenticación — Wireframe Low-Fidelity</title>
    <script src="https://cdn.tailwindcss.com"></script>
<base target="_blank">
</head>
<body class="bg-gray-950 min-h-[100dvh] flex items-center justify-center">

    <!-- ============================================================ -->
    <!-- APP SHELL                                                      -->
    <!-- ============================================================ -->
    <div class="w-full max-w-lg min-h-[100dvh] bg-white md:min-h-[90vh] md:my-[5vh] md:rounded-[2rem] md:border-[10px] md:border-gray-900 md:shadow-2xl overflow-hidden flex flex-col relative">

        <!-- ============================================================ -->
        <!-- ESTADO DE CARGA INICIAL (Skeleton)                             -->
        <!-- ============================================================ -->
        <div id="app-loading" class="absolute inset-0 z-[60] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-24 h-24 bg-gray-200 rounded-3xl mb-6 animate-pulse"></div>
            <div class="h-6 bg-gray-200 rounded w-48 mb-3 animate-pulse"></div>
            <div class="h-3 bg-gray-200 rounded w-64 animate-pulse"></div>
        </div>

        <!-- ============================================================ -->
        <!-- CONTENIDO PRINCIPAL                                            -->
        <!-- ============================================================ -->
        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden flex flex-col items-center justify-center p-8 relative opacity-0 transition-opacity duration-500">

            <!-- ============================================================ -->
            <!-- HERO / BRANDING                                                -->
            <!-- ============================================================ -->
            <div class="flex flex-col items-center mb-12 w-full">
                <!-- Logo app (placeholder) -->
                <div class="w-24 h-24 bg-gray-200 rounded-3xl mb-6 flex items-center justify-center">
                    <div class="w-12 h-12 bg-gray-400 rounded-xl"></div>
                </div>
                <!-- Nombre de la app (placeholder) -->
                <div class="h-6 bg-gray-800 rounded w-48 mb-3"></div>
                <!-- Tagline (placeholder) -->
                <div class="h-3 bg-gray-300 rounded w-64"></div>
            </div>

            <!-- ============================================================ -->
            <!-- BOTONES DE AUTENTICACIÓN OAUTH                                   -->
            <!-- ============================================================ -->
            <div class="w-full space-y-3">

                <!-- Botón Google -->
                <button id="google-btn" class="w-full bg-white border-2 border-gray-200 text-gray-700 min-h-[56px] rounded-2xl flex items-center justify-center gap-3 transition-all duration-200 shadow-sm hover:bg-gray-50 active:bg-gray-100 relative overflow-hidden" onclick="loginWithOAuth('google')">
                    <!-- Icono Google (SVG inline) -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span class="text-base font-semibold">Continuar con Google</span>
                    <!-- Ripple effect -->
                    <span class="absolute inset-0 bg-gray-400/10 scale-0 rounded-2xl transition-transform duration-300" id="google-ripple"></span>
                </button>

                <!-- Botón Discord -->
                <button id="discord-btn" class="w-full bg-[#5865F2] text-white min-h-[56px] rounded-2xl flex items-center justify-center gap-3 transition-all duration-200 shadow-sm hover:bg-[#4752C4] active:bg-[#3C45A5] relative overflow-hidden" onclick="loginWithOAuth('discord')">
                    <!-- Icono Discord (SVG inline) -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.007.128 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                    <span class="text-base font-semibold">Continuar con Discord</span>
                    <!-- Ripple effect -->
                    <span class="absolute inset-0 bg-white/20 scale-0 rounded-2xl transition-transform duration-300" id="discord-ripple"></span>
                </button>

            </div>

            <!-- ============================================================ -->
            <!-- FOOTER                                                         -->
            <!-- ============================================================ -->
            <div class="mt-8 text-center">
                <div class="h-3 bg-gray-200 rounded w-64 mx-auto"></div>
            </div>

            <!-- ============================================================ -->
            <!-- ESTADO DE CARGA POST-OAUTH (Overlay)                           -->
            <!-- ============================================================ -->
            <div id="auth-loading" class="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center gap-4 z-50 hidden">
                <!-- Spinner skeleton -->
                <div class="w-16 h-16 bg-gray-200 rounded-2xl animate-pulse mb-2"></div>
                <!-- Texto de conexión -->
                <div class="h-4 bg-gray-300 rounded w-56 animate-pulse" id="auth-loading-text"></div>
                <!-- Barra de progreso indeterminada -->
                <div class="w-48 h-2 bg-gray-200 rounded-full overflow-hidden mt-4">
                    <div id="auth-progress" class="h-full bg-gray-400 rounded-full animate-pulse" style="width: 0%"></div>
                </div>
            </div>

        </main>

        <!-- ============================================================ -->
        <!-- TOAST DE NOTIFICACIÓN                                          -->
        <!-- ============================================================ -->
        <div id="toast" class="absolute top-4 left-4 right-4 z-[70] pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
            <div class="bg-gray-800 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center shrink-0">
                    <svg id="toast-icon" class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="h-3 bg-gray-400 rounded w-3/4 mb-1" id="toast-title"></div>
                    <div class="h-2 bg-gray-500 rounded w-1/2" id="toast-subtitle"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT: Lógica de Interacción                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let isAuthenticating = false;
        let isNewUserToggle = false; // Toggle oculto para testing (doble tap en logo)
        let tapCount = 0;

        // ============================================================
        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar skeleton por 800ms, luego fade in del contenido
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');

                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';

                setTimeout(() => {
                    appLoading.style.display = 'none';
                }, 500);
            }, 800);

            // Toggle oculto: doble tap en logo cambia modo de simulación
            const logo = document.querySelector('.w-24.h-24.bg-gray-200.rounded-3xl');
            if (logo) {
                logo.addEventListener('click', () => {
                    tapCount++;
                    if (tapCount >= 2) {
                        isNewUserToggle = !isNewUserToggle;
                        tapCount = 0;
                        showToast(
                            isNewUserToggle ? 'Modo: Usuario NUEVO' : 'Modo: Usuario EXISTENTE',
                            'Doble tap en logo para alternar'
                        );
                    }
                    setTimeout(() => { tapCount = 0; }, 500);
                });
            }
        });

        // ============================================================
        // LOGIN CON OAUTH
        // ============================================================
        function loginWithOAuth(provider) {
            if (isAuthenticating) return;
            isAuthenticating = true;

            // Feedback táctil
            if (navigator.vibrate) navigator.vibrate(50);

            // Ripple effect
            const ripple = document.getElementById(provider + '-ripple');
            if (ripple) {
                ripple.style.transform = 'scale(1)';
                setTimeout(() => ripple.style.transform = 'scale(0)', 300);
            }

            // Mostrar overlay de carga
            showAuthLoading(provider);

            // Simular progreso
            let progress = 0;
            const progressBar = document.getElementById('auth-progress');
            const interval = setInterval(() => {
                progress += Math.random() * 25 + 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        handleAuthComplete(provider);
                    }, 400);
                }
                progressBar.style.width = progress + '%';
            }, 300);
        }

        // ============================================================
        // MANEJO POST-AUTENTICACIÓN
        // ============================================================
        function handleAuthComplete(provider) {
            hideAuthLoading();

            // Determinar estado del usuario (aleatorio 50% o toggle oculto)
            const isNewUser = isNewUserToggle !== undefined ? isNewUserToggle : Math.random() < 0.5;
            const hasCompletedOnboarding = !isNewUser && Math.random() < 0.8; // 80% de existentes tienen onboarding

            const providerName = provider === 'google' ? 'Google' : 'Discord';

            if (isNewUser) {
                // Usuario NUEVO
                showToast('¡Bienvenido!', 'Completa tu perfil para continuar');
                setTimeout(() => {
                    window.location.href = 'onboarding.html';
                }, 2000);
            } else if (!hasCompletedOnboarding) {
                // Usuario EXISTENTE sin onboarding completo (edge case)
                showToast('Completa tu perfil', 'Necesitamos más información');
                setTimeout(() => {
                    window.location.href = 'onboarding.html';
                }, 2000);
            } else {
                // Usuario EXISTENTE con onboarding completo
                showToast('¡Bienvenido de vuelta!', 'Redirigiendo al hub...');
                setTimeout(() => {
                    window.location.href = 'hub_mapa_principal.html';
                }, 1500);
            }
        }

        // ============================================================
        // OVERLAY DE CARGA
        // ============================================================
        function showAuthLoading(provider) {
            const overlay = document.getElementById('auth-loading');
            const textEl = document.getElementById('auth-loading-text');
            const providerName = provider === 'google' ? 'Google' : 'Discord';

            // Reemplazar el placeholder skeleton con texto real
            textEl.classList.remove('bg-gray-300', 'rounded', 'w-56', 'animate-pulse', 'h-4');
            textEl.classList.add('text-gray-600', 'text-sm', 'font-medium');
            textEl.textContent = 'Conectando con ' + providerName + '...';

            overlay.classList.remove('hidden');
            document.getElementById('auth-progress').style.width = '0%';
        }

        function hideAuthLoading() {
            const overlay = document.getElementById('auth-loading');
            overlay.classList.add('hidden');
            isAuthenticating = false;

            // Restaurar placeholder skeleton
            const textEl = document.getElementById('auth-loading-text');
            textEl.className = 'h-4 bg-gray-300 rounded w-56 animate-pulse';
            textEl.textContent = '';
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            const toastIcon = document.getElementById('toast-icon');

            clearTimeout(toastTimeout);

            // Ajustar anchos de placeholder según longitud del texto
            toastTitle.style.width = Math.min(title.length * 8 + 20, 220) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6 + 20, 180) + 'px';

            // Cambiar icono según tipo de mensaje
            if (title.includes('Bienvenido')) {
                toastIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>';
            } else {
                toastIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
            }

            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';

            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }
    </script>

</body>
</html>
