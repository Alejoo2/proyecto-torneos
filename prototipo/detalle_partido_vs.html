        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                
                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';
                
                setTimeout(() => {
                    appLoading.style.display = 'none';
                    showToast('Partido cargado', 'Resultado final: 3 - 2');
                }, 500);
            }, 1000);
        });

        // ============================================================
        // MODAL DE OPCIONES
        // ============================================================
        function showMatchOptions() {
            const modal = document.getElementById('options-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                modal.querySelector('div').style.transform = 'translateY(0)';
            }, 10);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function closeOptionsModal() {
            const modal = document.getElementById('options-modal');
            modal.style.opacity = '0';
            modal.querySelector('div').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function shareMatch() {
            closeOptionsModal();
            if (navigator.share) {
                navigator.share({
                    title: 'Los Leones vs Los Tigres',
                    text: 'Mira el resultado de este partidazo',
                    url: window.location.href
                }).catch(() => {
                    showToast('Compartido', 'Enlace copiado al portapapeles');
                });
            } else {
                showToast('Compartido', 'Enlace copiado al portapapeles');
            }
        }

        function reportMatch() {
            closeOptionsModal();
            showToast('Reporte enviado', 'Gracias por tu feedback');
        }

        function downloadStats() {
            closeOptionsModal();
            showToast('Descargando', 'Estadísticas del partido...');
        }

        // ============================================================
        // DETALLES
        // ============================================================
        function showStatCompare(stat) {
            const labels = {
                'goles': '3-2 en goles',
                'tarjetas': '2-1 en tarjetas',
                'faltas': '8-6 en faltas'
            };
            showToast('Comparativa', labels[stat]);
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            
            clearTimeout(toastTimeout);
            
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            
            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';
            
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }

        // ============================================================
        // TECLADO (Escape para cerrar modal)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOptionsModal();
        });
    </script>

</body>
</html>
