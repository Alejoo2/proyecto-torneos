<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Torneo — Sorteo Gráfico — Wireframe Low-Fidelity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-[100dvh] flex items-center justify-center">

    <!-- ============================================================ -->
    <!-- APP SHELL: El "Móvil"                                          -->
    <!-- ============================================================ -->
    <div class="w-full max-w-lg min-h-[100dvh] bg-white md:min-h-[90vh] md:my-[5vh] md:rounded-[2rem] md:border-[10px] md:border-gray-900 md:shadow-2xl overflow-hidden flex flex-col relative">

        <!-- ============================================================ -->
        <!-- ESTADO DE CARGA INICIAL (Skeleton)                             -->
        <!-- ============================================================ -->
        <div id="app-loading" class="absolute inset-0 z-[60] bg-white flex flex-col transition-opacity duration-500">
            <!-- Skeleton del header -->
            <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-48 animate-pulse"></div>
                </div>
                <div class="w-16 h-6 bg-gray-200 rounded-full animate-pulse"></div>
            </div>
            <!-- Skeleton del tab bar -->
            <div class="px-6 pt-4 pb-2">
                <div class="bg-gray-100 rounded-2xl p-1.5 flex h-12">
                    <div class="flex-1 bg-gray-200 rounded-xl animate-pulse mx-0.5"></div>
                    <div class="flex-1 bg-gray-200 rounded-xl animate-pulse mx-0.5"></div>
                    <div class="flex-1 bg-gray-200 rounded-xl animate-pulse mx-0.5"></div>
                </div>
            </div>
            <!-- Skeleton del bombo -->
            <div class="px-6 pt-6 flex items-center justify-center gap-6 mb-8">
                <div class="w-28 h-28 bg-gray-200 rounded-full animate-pulse border-4 border-gray-100"></div>
                <div class="w-8 h-8 bg-gray-200 rounded animate-pulse"></div>
                <div class="w-28 h-28 bg-gray-200 rounded-full animate-pulse border-4 border-gray-100"></div>
            </div>
            <!-- Skeleton barra de progreso -->
            <div class="px-6 mb-8">
                <div class="flex items-center justify-between mb-2">
                    <div class="h-2 bg-gray-200 rounded w-24 animate-pulse"></div>
                    <div class="h-2 bg-gray-200 rounded w-8 animate-pulse"></div>
                </div>
                <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div class="h-full bg-gray-200 rounded-full animate-pulse" style="width: 0%"></div>
                </div>
            </div>
            <!-- Skeleton emparejamientos -->
            <div class="px-6 space-y-4">
                <div class="h-4 bg-gray-200 rounded w-32 animate-pulse mb-4"></div>
                <div class="bg-gray-100 rounded-2xl p-4 h-20 animate-pulse"></div>
                <div class="bg-gray-100 rounded-2xl p-4 h-20 animate-pulse"></div>
                <div class="bg-gray-100 rounded-2xl p-4 h-20 animate-pulse"></div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- HEADER: Sticky con badge de rol Gestor                         -->
        <!-- ============================================================ -->
        <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-3">
                    <a href="detalle_torneo.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 active:bg-gray-200 transition-colors min-w-[44px] min-h-[44px]" aria-label="Volver al torneo">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div class="h-4 bg-gray-800 rounded w-48"></div>
                </div>
                <div class="bg-gray-800 text-white px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                    <div class="h-2 bg-gray-400 rounded w-14"></div>
                </div>
            </div>
        </header>

        <!-- ============================================================ -->
        <!-- CONTENIDO PRINCIPAL                                            -->
        <!-- ============================================================ -->
        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden pb-24 opacity-0 transition-opacity duration-500">

            <!-- ============================================================ -->
            <!-- SISTEMA DE PESTAÑAS (Tabs)                                     -->
            <!-- ============================================================ -->
            <div class="px-6 pt-4 pb-2 sticky top-0 z-10 bg-white/80 backdrop-blur-sm">
                <div class="bg-gray-100 rounded-2xl p-1.5 flex" role="tablist" aria-label="Gestión del torneo">
                    <!-- Tab 1: Inscripciones -->
                    <a href="gestion_torneo_inscripciones.html" id="tab-btn-inscripciones" class="flex-1 text-gray-500 py-3 rounded-xl text-sm font-medium hover:text-gray-700 hover:bg-gray-200/50 active:bg-gray-200 transition-all duration-200 min-h-[44px] flex items-center justify-center" role="tab" aria-selected="false" aria-controls="tab-inscripciones">
                        <div class="h-3 bg-gray-300 rounded w-24 mx-auto"></div>
                    </a>
                    <!-- Tab 2: Sorteo (Activo) -->
                    <button id="tab-btn-sorteo" class="flex-1 bg-gray-800 text-white py-3 rounded-xl text-sm font-medium transition-all duration-200 min-h-[44px] relative overflow-hidden" role="tab" aria-selected="true" aria-controls="tab-sorteo" onclick="switchTab('sorteo')">
                        <div class="h-3 bg-gray-400 rounded w-16 mx-auto"></div>
                        <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-sorteo"></span>
                    </button>
                    <!-- Tab 3: Planilla -->
                    <a href="gestion_torneo_planilla.html" id="tab-btn-planilla" class="flex-1 text-gray-500 py-3 rounded-xl text-sm font-medium hover:text-gray-700 hover:bg-gray-200/50 active:bg-gray-200 transition-all duration-200 min-h-[44px] flex items-center justify-center" role="tab" aria-selected="false" aria-controls="tab-planilla">
                        <div class="h-3 bg-gray-300 rounded w-20 mx-auto"></div>
                    </a>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- TAB 2: SORTEO GRÁFICO                                          -->
            <!-- ============================================================ -->
            <div id="tab-sorteo" class="px-6 pt-4" role="tabpanel" aria-labelledby="tab-btn-sorteo">

                <!-- Header con título y botón -->
                <div class="flex items-center justify-between mb-6">
                    <div class="h-5 bg-gray-800 rounded w-40"></div>
                    <button id="btn-iniciar-sorteo" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 shadow-lg min-h-[44px] relative overflow-hidden" onclick="iniciarSorteo()">
                        <div class="h-3 bg-gray-400 rounded w-24 mx-auto"></div>
                        <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-iniciar"></span>
                    </button>
                </div>

                <!-- ============================================================ -->
                <!-- ÁREA DE BOMBOS                                                 -->
                <!-- ============================================================ -->
                <!-- Intención: Dos contenedores circulares grandes que representan -->
                <!-- los equipos mezclándose. Animación de shuffle al iniciar.       -->
                <div class="flex items-center justify-center gap-6 mb-10">
                    <!-- Bombo A -->
                    <div class="relative">
                        <div id="bombo-a" class="w-28 h-28 bg-gray-200 rounded-full flex items-center justify-center border-4 border-gray-300 shadow-lg transition-all duration-500">
                            <div class="w-14 h-14 bg-gray-300 rounded-full flex items-center justify-center">
                                <div class="w-8 h-8 bg-gray-400 rounded-lg"></div>
                            </div>
                        </div>
                        <!-- Label -->
                        <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2">
                            <div class="h-3 bg-gray-400 rounded w-16"></div>
                        </div>
                        <!-- Contador de equipos -->
                        <div class="absolute -top-2 -right-2 w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            <div class="h-3 bg-gray-400 rounded w-4" id="contador-a"></div>
                        </div>
                    </div>

                    <!-- Ícono de mezcla/flechas -->
                    <div class="flex flex-col items-center gap-1">
                        <svg id="icono-mezcla" class="w-8 h-8 text-gray-400 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                        </svg>
                        <div class="h-2 bg-gray-300 rounded w-12"></div>
                    </div>

                    <!-- Bombo B -->
                    <div class="relative">
                        <div id="bombo-b" class="w-28 h-28 bg-gray-200 rounded-full flex items-center justify-center border-4 border-gray-300 shadow-lg transition-all duration-500">
                            <div class="w-14 h-14 bg-gray-300 rounded-full flex items-center justify-center">
                                <div class="w-8 h-8 bg-gray-400 rounded-lg"></div>
                            </div>
                        </div>
                        <!-- Label -->
                        <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2">
                            <div class="h-3 bg-gray-400 rounded w-16"></div>
                        </div>
                        <!-- Contador de equipos -->
                        <div class="absolute -top-2 -right-2 w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            <div class="h-3 bg-gray-400 rounded w-4" id="contador-b"></div>
                        </div>
                    </div>
                </div>

                <!-- Barra de progreso del sorteo -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-2">
                        <div class="h-2 bg-gray-400 rounded w-24" id="progreso-label"></div>
                        <div class="h-2 bg-gray-400 rounded w-8" id="progreso-porcentaje"></div>
                    </div>
                    <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div id="barra-progreso" class="h-full bg-gray-600 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- ============================================================ -->
                <!-- ÁREA DE RESULTADOS (VS)                                        -->
                <!-- ============================================================ -->
                <div class="mb-6" id="area-resultados">
                    <div class="h-4 bg-gray-800 rounded w-32 mb-4"></div>

                    <div class="space-y-4" id="emparejamientos-lista">
                        <!-- Emparejamiento 1 -->
                        <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showMatchDetail(1)">
                            <div class="flex items-center justify-between">
                                <!-- Team A -->
                                <div class="flex items-center gap-3 flex-1">
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                    <div class="h-3 bg-gray-800 rounded w-20"></div>
                                </div>
                                <!-- VS -->
                                <div class="px-4">
                                    <div class="h-4 bg-gray-600 rounded w-8"></div>
                                </div>
                                <!-- Team B -->
                                <div class="flex items-center gap-3 flex-1 justify-end">
                                    <div class="h-3 bg-gray-800 rounded w-20"></div>
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Info adicional del partido -->
                            <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-200">
                                <div class="h-2 bg-gray-300 rounded w-20"></div>
                                <div class="h-2 bg-gray-300 rounded w-16"></div>
                            </div>
                        </div>

                        <!-- Emparejamiento 2 -->
                        <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showMatchDetail(2)">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3 flex-1">
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                    <div class="h-3 bg-gray-800 rounded w-18"></div>
                                </div>
                                <div class="px-4">
                                    <div class="h-4 bg-gray-600 rounded w-8"></div>
                                </div>
                                <div class="flex items-center gap-3 flex-1 justify-end">
                                    <div class="h-3 bg-gray-800 rounded w-22"></div>
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-200">
                                <div class="h-2 bg-gray-300 rounded w-20"></div>
                                <div class="h-2 bg-gray-300 rounded w-16"></div>
                            </div>
                        </div>

                        <!-- Emparejamiento 3 -->
                        <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showMatchDetail(3)">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3 flex-1">
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                    <div class="h-3 bg-gray-800 rounded w-24"></div>
                                </div>
                                <div class="px-4">
                                    <div class="h-4 bg-gray-600 rounded w-8"></div>
                                </div>
                                <div class="flex items-center gap-3 flex-1 justify-end">
                                    <div class="h-3 bg-gray-800 rounded w-16"></div>
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-200">
                                <div class="h-2 bg-gray-300 rounded w-20"></div>
                                <div class="h-2 bg-gray-300 rounded w-16"></div>
                            </div>
                        </div>

                        <!-- Emparejamiento 4 -->
                        <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showMatchDetail(4)">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3 flex-1">
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                    <div class="h-3 bg-gray-800 rounded w-20"></div>
                                </div>
                                <div class="px-4">
                                    <div class="h-4 bg-gray-600 rounded w-8"></div>
                                </div>
                                <div class="flex items-center gap-3 flex-1 justify-end">
                                    <div class="h-3 bg-gray-800 rounded w-20"></div>
                                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center">
                                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-200">
                                <div class="h-2 bg-gray-300 rounded w-20"></div>
                                <div class="h-2 bg-gray-300 rounded w-16"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botón de confirmar sorteo -->
                <button id="btn-confirmar-sorteo" class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 mb-6 shadow-lg min-h-[56px] relative overflow-hidden" onclick="confirmarSorteo()">
                    <div class="h-4 bg-gray-400 rounded w-40 mx-auto"></div>
                    <span class="absolute inset-0 bg-white/20 scale-0 rounded-2xl transition-transform duration-300" id="ripple-confirmar"></span>
                </button>

            </div>

            <!-- ============================================================ -->
            <!-- TAB 1: INSCRIPCIONES (Placeholder)                             -->
            <!-- ============================================================ -->
            <div id="tab-inscripciones" class="px-6 pt-4 hidden" role="tabpanel" aria-labelledby="tab-btn-inscripciones">
                <div class="text-center py-12">
                    <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    </div>
                    <div class="h-4 bg-gray-800 rounded w-40 mx-auto mb-2"></div>
                    <div class="h-3 bg-gray-300 rounded w-56 mx-auto"></div>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- TAB 3: PLANILLA (Placeholder)                                  -->
            <!-- ============================================================ -->
            <div id="tab-planilla" class="px-6 pt-4 hidden" role="tabpanel" aria-labelledby="tab-btn-planilla">
                <div class="text-center py-12">
                    <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    </div>
                    <div class="h-4 bg-gray-800 rounded w-40 mx-auto mb-2"></div>
                    <div class="h-3 bg-gray-300 rounded w-56 mx-auto"></div>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- NOTIFICACIÓN CONTEXTUAL INFERIOR                               -->
            <!-- ============================================================ -->
            <div class="px-6 mt-6 mb-8">
                <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showSorteoInfo()">
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                        <div class="w-5 h-5 bg-gray-400 rounded"></div>
                    </div>
                    <div class="flex-1">
                        <div class="h-3 bg-gray-600 rounded w-48 mb-1"></div>
                        <div class="h-2 bg-gray-300 rounded w-32"></div>
                    </div>
                    <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </div>

        </main>

        <!-- ============================================================ -->
        <!-- NAVBAR INFERIOR                                                -->
        <!-- ============================================================ -->
        <nav class="absolute bottom-0 w-full z-50 bg-white border-t border-gray-200" style="padding-bottom: env(safe-area-inset-bottom);">
            <div class="grid grid-cols-4 h-16">
                <a href="hub_mapa_principal.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-600 active:text-gray-800 transition-colors min-h-[44px]" aria-label="Inicio">
                    <div class="w-6 h-6 bg-gray-300 rounded"></div>
                    <div class="h-2 bg-gray-300 rounded w-10"></div>
                </a>
                <a href="detalle_equipo_card_maestra.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-600 active:text-gray-800 transition-colors min-h-[44px]" aria-label="Equipo">
                    <div class="w-6 h-6 bg-gray-300 rounded"></div>
                    <div class="h-2 bg-gray-300 rounded w-10"></div>
                </a>
                <a href="detalle_torneo.html" class="flex flex-col items-center justify-center gap-1 text-gray-800 min-h-[44px]" aria-label="Torneos">
                    <div class="w-6 h-6 bg-gray-800 rounded"></div>
                    <div class="h-2 bg-gray-800 rounded w-10"></div>
                </a>
                <a href="perfil_jugador.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-600 active:text-gray-800 transition-colors min-h-[44px]" aria-label="Perfil">
                    <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                    <div class="h-2 bg-gray-300 rounded w-10"></div>
                </a>
            </div>
        </nav>

        <!-- ============================================================ -->
        <!-- TOAST DE NOTIFICACIÓN                                          -->
        <!-- ============================================================ -->
        <div id="toast" class="absolute top-20 left-4 right-4 z-[70] pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
            <div class="bg-gray-800 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center shrink-0">
                    <div class="w-4 h-4 bg-gray-400 rounded"></div>
                </div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-400 rounded w-3/4 mb-1" id="toast-title"></div>
                    <div class="h-2 bg-gray-500 rounded w-1/2" id="toast-subtitle"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL DE INFORMACIÓN DEL SORTEO                                -->
        <!-- ============================================================ -->
        <div id="sorteo-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="sorteo-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                
                <div class="space-y-3 mb-6">
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-48 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-32"></div>
                        </div>
                    </div>
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-40 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-28"></div>
                        </div>
                    </div>
                </div>

                <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeSorteoModal()">
                    <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT: Lógica de Interacción                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ESTADO
        // ============================================================
        let sorteoEnProgreso = false;
        let sorteoCompletado = false;
        let progresoActual = 0;

        // ============================================================
        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                
                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';
                
                setTimeout(() => {
                    appLoading.style.display = 'none';
                    showToast('Sorteo del torneo', '8 equipos listos para emparejar');
                }, 500);
            }, 1200);
        });

        // ============================================================
        // NAVEGACIÓN DE TABS
        // ============================================================
        function switchTab(tabName) {
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // ============================================================
        // INICIAR SORTEO
        // ============================================================
        function iniciarSorteo() {
            if (sorteoEnProgreso) return;
            if (sorteoCompletado) {
                showToast('Sorteo completado', 'Los emparejamientos ya están definidos');
                return;
            }

            sorteoEnProgreso = true;
            
            // Ripple effect
            const ripple = document.getElementById('ripple-iniciar');
            ripple.style.transform = 'scale(1)';
            setTimeout(() => ripple.style.transform = 'scale(0)', 300);

            // Feedback táctil
            if (navigator.vibrate) navigator.vibrate(50);

            // Animación de los bombos
            const bomboA = document.getElementById('bombo-a');
            const bomboB = document.getElementById('bombo-b');
            const iconoMezcla = document.getElementById('icono-mezcla');

            bomboA.classList.add('animate-pulse');
            bomboB.classList.add('animate-pulse');
            iconoMezcla.style.transform = 'rotate(180deg)';
            iconoMezcla.classList.add('text-gray-800');

            // Simular progreso
            const barra = document.getElementById('barra-progreso');
            const porcentaje = document.getElementById('progreso-porcentaje');
            let progreso = 0;
            
            const intervalo = setInterval(() => {
                progreso += Math.random() * 15 + 5;
                if (progreso >= 100) {
                    progreso = 100;
                    clearInterval(intervalo);
                    
                    // Finalizar animación
                    bomboA.classList.remove('animate-pulse');
                    bomboB.classList.remove('animate-pulse');
                    iconoMezcla.style.transform = 'rotate(0deg)';
                    iconoMezcla.classList.remove('text-gray-800');
                    
                    sorteoEnProgreso = false;
                    sorteoCompletado = true;
                    
                    // Actualizar botón
                    const btn = document.getElementById('btn-iniciar-sorteo');
                    btn.classList.remove('bg-gray-800', 'hover:bg-gray-700', 'active:bg-gray-900');
                    btn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
                    btn.disabled = true;
                    btn.setAttribute('aria-disabled', 'true');
                    btn.querySelector('div').style.width = '20px';
                    btn.querySelector('div').style.margin = '0 auto';
                    
                    setTimeout(() => {
                        showToast('¡Sorteo completado!', '4 emparejamientos generados exitosamente');
                    }, 300);
                }
                
                barra.style.width = progreso + '%';
                porcentaje.innerHTML = `<div class="h-2 bg-gray-400 rounded w-8">${Math.round(progreso)}%</div>`;
            }, 400);
        }

        // ============================================================
        // CONFIRMAR SORTEO
        // ============================================================
        function confirmarSorteo() {
            if (!sorteoCompletado) {
                showToast('Sorteo pendiente', 'Primero debes ejecutar el sorteo');
                return;
            }

            // Ripple effect
            const ripple = document.getElementById('ripple-confirmar');
            ripple.style.transform = 'scale(1)';
            setTimeout(() => ripple.style.transform = 'scale(0)', 300);

            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

            const btn = document.getElementById('btn-confirmar-sorteo');
            btn.classList.remove('bg-gray-800', 'hover:bg-gray-700', 'active:bg-gray-900');
            btn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');
            btn.querySelector('div').style.width = '20px';
            btn.querySelector('div').style.margin = '0 auto';

            setTimeout(() => {
                showToast('Sorteo confirmado', 'Los partidos han sido programados en el calendario');
            }, 300);
        }

        // ============================================================
        // DETALLE DE EMPAREJAMIENTO
        // ============================================================
        function showMatchDetail(matchId) {
            showToast(`Partido #${matchId}`, 'Abriendo detalle del emparejamiento...');
        }

        // ============================================================
        // INFO DEL SORTEO
        // ============================================================
        function showSorteoInfo() {
            const modal = document.getElementById('sorteo-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('sorteo-modal-content').style.transform = 'translateY(0)';
            }, 10);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function closeSorteoModal() {
            const modal = document.getElementById('sorteo-modal');
            modal.style.opacity = '0';
            document.getElementById('sorteo-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            
            clearTimeout(toastTimeout);
            
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            
            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';
            
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }

        // ============================================================
        // TECLADO (Escape para cerrar modal)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSorteoModal();
        });

        // ============================================================
        // SWIPE PARA CERRAR MODAL
        // ============================================================
        let touchStartY = 0;
        const sorteoModalContent = document.getElementById('sorteo-modal-content');
        
        if (sorteoModalContent) {
            sorteoModalContent.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            sorteoModalContent.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                if (touchEndY - touchStartY > 80) {
                    closeSorteoModal();
                }
            }, { passive: true });
        }
    </script>

</body>
</html>
