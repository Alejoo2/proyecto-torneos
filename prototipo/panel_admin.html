<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Administracion — Wireframe Low-Fidelity</title>
    <script src="https://cdn.tailwindcss.com"></script>
<base target="_blank">
</head>
<body class="bg-gray-950 min-h-[100dvh] flex items-center justify-center">

    <!-- ============================================================ -->
    <!-- APP SHELL: Mobile-first, max-w-lg, fondo blanco                -->
    <!-- ============================================================ -->
    <div class="w-full max-w-lg min-h-[100dvh] bg-white md:min-h-[90vh] md:my-[5vh] md:rounded-[2rem] md:border-[10px] md:border-gray-900 md:shadow-2xl overflow-hidden flex flex-col relative">

        <!-- ============================================================ -->
        <!-- ESTADO DE CARGA INICIAL (Skeleton)                             -->
        <!-- ============================================================ -->
        <div id="app-loading" class="absolute inset-0 z-[60] bg-white flex flex-col transition-opacity duration-500">
            <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-32 animate-pulse"></div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="w-14 h-6 bg-gray-200 rounded-full animate-pulse"></div>
                </div>
            </div>
            <div class="px-6 pt-6">
                <div class="h-5 bg-gray-200 rounded w-32 animate-pulse mb-6"></div>
                <div class="bg-gray-100 rounded-2xl p-5 h-14 animate-pulse mb-4"></div>
                <div class="bg-gray-100 rounded-2xl p-5 h-32 animate-pulse mb-6"></div>
                <div class="space-y-3">
                    <div class="bg-gray-100 rounded-2xl p-4 h-20 animate-pulse"></div>
                    <div class="bg-gray-100 rounded-2xl p-4 h-20 animate-pulse"></div>
                </div>
            </div>
            <div class="h-px bg-gray-200 mx-6 my-8 animate-pulse"></div>
            <div class="px-6">
                <div class="h-5 bg-gray-200 rounded w-24 animate-pulse mb-6"></div>
                <div class="bg-gray-200 rounded-2xl h-14 animate-pulse mb-6"></div>
                <div class="space-y-3">
                    <div class="bg-gray-100 rounded-2xl p-4 h-28 animate-pulse"></div>
                    <div class="bg-gray-100 rounded-2xl p-4 h-28 animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- HEADER: Sticky — VISTA ADMIN (Sistema 1 / Sistema 5 / Sistema 11) -->
        <!-- ============================================================ -->
        <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-3">
                    <a href="hub_mapa_principal.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 active:bg-gray-200 transition-colors min-w-[44px] min-h-[44px]" aria-label="Volver al inicio">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div class="h-4 bg-gray-800 rounded w-36"></div>
                </div>
                <div class="flex items-center gap-2">
                    <button class="relative w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 active:bg-gray-200 transition-colors min-w-[44px] min-h-[44px]" aria-label="Notificaciones" onclick="showAdminNotifications()">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                        </svg>
                        <span class="absolute top-1 right-1 w-5 h-5 bg-gray-800 text-white text-[10px] font-bold rounded-full flex items-center justify-center">3</span>
                    </button>
                    <div class="bg-gray-800 text-white px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5">
                        <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                        <div class="h-2 bg-gray-400 rounded w-8"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ============================================================ -->
        <!-- CONTENIDO PRINCIPAL                                            -->
        <!-- ============================================================ -->
        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden pb-8 opacity-0 transition-opacity duration-500">

            <!-- ============================================================ -->
            <!-- SECCION 1: GESTORES (Sistema 1 — RoleAssignment / Manager)     -->
            <!-- VISTA ADMIN                                                    -->
            <!-- ============================================================ -->
            <div class="px-6 pt-6 mb-8">
                <div class="h-5 bg-gray-800 rounded w-32 mb-6"></div>

                <!-- Buscador de usuarios existentes (perfiles ya registrados via OAuth) -->
                <div class="bg-gray-100 rounded-2xl p-4 mb-4">
                    <div class="h-3 bg-gray-800 rounded w-48 mb-3"></div>
                    <div class="w-full h-14 bg-white rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                        <div class="w-5 h-5 bg-gray-300 rounded mr-3"></div>
                        <div class="h-3 bg-gray-300 rounded w-40"></div>
                    </div>
                    <div class="mt-3 space-y-2 hidden" id="search-results">
                        <button class="w-full bg-white rounded-xl p-3 flex items-center gap-3 hover:bg-gray-50 active:bg-gray-100 transition-colors text-left" onclick="selectUserForManager(1)">
                            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                <div class="w-5 h-5 bg-gray-300 rounded-full"></div>
                            </div>
                            <div class="flex-1">
                                <div class="h-3 bg-gray-800 rounded w-28 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-40"></div>
                            </div>
                        </button>
                        <button class="w-full bg-white rounded-xl p-3 flex items-center gap-3 hover:bg-gray-50 active:bg-gray-100 transition-colors text-left" onclick="selectUserForManager(2)">
                            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                <div class="w-5 h-5 bg-gray-300 rounded-full"></div>
                            </div>
                            <div class="flex-1">
                                <div class="h-3 bg-gray-800 rounded w-24 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-36"></div>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Panel de configuracion de gestor (se muestra al seleccionar usuario) -->
                <div id="manager-config-panel" class="bg-gray-100 rounded-2xl p-5 mb-6 hidden">
                    <div class="h-4 bg-gray-800 rounded w-40 mb-4"></div>
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-36 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-48"></div>
                        </div>
                        <button class="w-14 h-8 bg-gray-800 rounded-full relative transition-colors" onclick="toggleManagerActive(this)" id="manager-active-toggle">
                            <span class="absolute right-1 top-1 w-6 h-6 bg-white rounded-full transition-transform"></span>
                        </button>
                    </div>
                    <div class="mb-4">
                        <div class="h-3 bg-gray-800 rounded w-28 mb-3"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-28"></div>
                            </label>
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-28"></div>
                            </label>
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-24"></div>
                            </label>
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-24"></div>
                            </label>
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-20"></div>
                            </label>
                            <label class="flex items-center gap-2 bg-white rounded-xl p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <div class="w-5 h-5 bg-gray-300 rounded border-2 border-gray-300"></div>
                                <div class="h-3 bg-gray-600 rounded w-24"></div>
                            </label>
                        </div>
                    </div>
                    <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="saveManagerConfig()">
                        <div class="h-4 bg-gray-400 rounded w-32 mx-auto"></div>
                    </button>
                </div>

                <!-- Lista de gestores activos/inactivos con estado y permisos -->
                <div>
                    <div class="h-4 bg-gray-800 rounded w-40 mb-4"></div>
                    <div class="space-y-3" id="lista-gestores">
                        <div class="bg-gray-100 rounded-2xl p-4">
                            <div class="flex items-center gap-4 mb-3">
                                <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                    <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="h-3 bg-gray-800 rounded w-28 mb-1"></div>
                                    <div class="h-2 bg-gray-300 rounded w-40"></div>
                                </div>
                                <div class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
                                    <div class="h-2 bg-gray-400 rounded w-10"></div>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                <div class="bg-gray-200 px-2 py-1 rounded-lg"><div class="h-2 bg-gray-400 rounded w-20"></div></div>
                                <div class="bg-gray-200 px-2 py-1 rounded-lg"><div class="h-2 bg-gray-400 rounded w-24"></div></div>
                                <div class="bg-gray-200 px-2 py-1 rounded-lg"><div class="h-2 bg-gray-400 rounded w-16"></div></div>
                            </div>
                        </div>
                        <div class="bg-gray-100 rounded-2xl p-4">
                            <div class="flex items-center gap-4 mb-3">
                                <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                    <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="h-3 bg-gray-800 rounded w-24 mb-1"></div>
                                    <div class="h-2 bg-gray-300 rounded w-36"></div>
                                </div>
                                <div class="bg-gray-300 text-gray-500 text-xs px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
                                    <div class="h-2 bg-gray-400 rounded w-12"></div>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                <div class="bg-gray-200 px-2 py-1 rounded-lg"><div class="h-2 bg-gray-400 rounded w-16"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="h-px bg-gray-200 mx-6 mb-8"></div>

            <!-- ============================================================ -->
            <!-- SECCION 2: CANCHAS / SEDES (Sistema 5 — Court / CourtAvailability) -->
            <!-- VISTA ADMIN                                                    -->
            <!-- Nota interna: Al crear cancha, el backend genera automaticamente -->
            <!-- 168 filas de CourtAvailability (14 dias x 12 franjas horarias).  -->
            <!-- El admin no las crea manualmente.                              -->
            <!-- ============================================================ -->
            <div class="px-6 mb-8">
                <div class="h-5 bg-gray-800 rounded w-24 mb-6"></div>

                <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 mb-6 shadow-lg flex items-center justify-center gap-3 min-h-[56px]" onclick="openAddCourtModal()">
                    <div class="w-6 h-6 bg-gray-400 rounded"></div>
                    <div class="h-4 bg-gray-400 rounded w-28"></div>
                </button>

                <div class="space-y-3" id="lista-canchas">
                    <!-- Cancha ENABLED -->
                    <div class="bg-gray-100 rounded-2xl p-4">
                        <div class="flex items-start gap-4 mb-3">
                            <div class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-32 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-2/3 mb-2"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-800 text-white text-xs px-2.5 py-1 rounded-full">
                                        <div class="h-2 bg-gray-400 rounded w-12"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="flex-1 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="editCourt(1)" aria-label="Editar cancha">
                                <div class="w-4 h-4 bg-gray-300 rounded"></div>
                                <div class="h-3 bg-gray-600 rounded w-10"></div>
                            </button>
                            <button class="flex-1 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="toggleCourtStatus(1)" aria-label="Deshabilitar cancha">
                                <div class="w-4 h-4 bg-gray-300 rounded"></div>
                                <div class="h-3 bg-gray-600 rounded w-14"></div>
                            </button>
                            <button class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="openCourtAvailability(1)" aria-label="Ver disponibilidad">
                                <div class="w-4 h-4 bg-gray-400 rounded"></div>
                                <div class="h-3 bg-gray-400 rounded w-20"></div>
                            </button>
                        </div>
                    </div>

                    <!-- Cancha DISABLED -->
                    <div class="bg-gray-100 rounded-2xl p-4">
                        <div class="flex items-start gap-4 mb-3">
                            <div class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-28 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-3/4 mb-2"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-300 text-gray-500 text-xs px-2.5 py-1 rounded-full">
                                        <div class="h-2 bg-gray-400 rounded w-14"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="flex-1 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="editCourt(2)" aria-label="Editar cancha">
                                <div class="w-4 h-4 bg-gray-300 rounded"></div>
                                <div class="h-3 bg-gray-600 rounded w-10"></div>
                            </button>
                            <button class="flex-1 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="toggleCourtStatus(2)" aria-label="Habilitar cancha">
                                <div class="w-4 h-4 bg-gray-300 rounded"></div>
                                <div class="h-3 bg-gray-600 rounded w-12"></div>
                            </button>
                            <button class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 rounded-xl py-3 flex items-center justify-center gap-2 transition-colors shadow-sm min-h-[44px]" onclick="openCourtAvailability(2)" aria-label="Ver disponibilidad">
                                <div class="w-4 h-4 bg-gray-400 rounded"></div>
                                <div class="h-3 bg-gray-400 rounded w-20"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="h-px bg-gray-200 mx-6 mb-8"></div>

            <!-- ============================================================ -->
            <!-- SECCION 3: INFO / NOTIFICACIONES DEL SISTEMA (Sistema 11)    -->
            <!-- VISTA ADMIN — Anuncios de familia SYSTEM (no desactivables)    -->
            <!-- ============================================================ -->
            <div class="px-6 mb-8">
                <div class="h-5 bg-gray-800 rounded w-48 mb-4"></div>
                <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showSystemAnnouncements()">
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                        <div class="w-5 h-5 bg-gray-400 rounded"></div>
                    </div>
                    <div class="flex-1">
                        <div class="h-3 bg-gray-800 rounded w-48 mb-1"></div>
                        <div class="h-2 bg-gray-300 rounded w-32"></div>
                    </div>
                    <div class="bg-gray-800 text-white text-xs px-2.5 py-1 rounded-full">
                        <div class="h-2 bg-gray-400 rounded w-4"></div>
                    </div>
                    <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </div>

        </main>

        <!-- ============================================================ -->
        <!-- SIN NAVBAR INFERIOR (Admin no usa navegacion de jugador)       -->
        <!-- ============================================================ -->

        <!-- ============================================================ -->
        <!-- TOAST DE NOTIFICACION                                          -->
        <!-- ============================================================ -->
        <div id="toast" class="absolute top-20 left-4 right-4 z-[70] pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
            <div class="bg-gray-800 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center shrink-0">
                    <div class="w-4 h-4 bg-gray-400 rounded"></div>
                </div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-400 rounded w-3/4 mb-1" id="toast-title"></div>
                    <div class="h-2 bg-gray-500 rounded w-1/2" id="toast-subtitle"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL BOTTOM-SHEET: Anadir/Editar Cancha (Sistema 5)         -->
        <!-- Campos: nombre, direccion, descripcion, inventario             -->
        <!-- ============================================================ -->
        <div id="court-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="court-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                <form class="space-y-4 mb-6" onsubmit="event.preventDefault(); saveCourt();">
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-16"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-32"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-20"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-40"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-24"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-36"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-20"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-28"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]">
                        <div class="h-4 bg-gray-400 rounded w-24 mx-auto"></div>
                    </button>
                </form>
                <button class="w-full bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeCourtModal()">
                    <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                </button>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL BOTTOM-SHEET: Disponibilidad de Cancha (14 dias x 12 franjas) -->
        <!-- Sistema 5 — CourtAvailability                                  -->
        <!-- ============================================================ -->
        <div id="availability-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl w-full max-h-[85vh] flex flex-col transform translate-y-full transition-transform duration-300" id="availability-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mt-4 mb-4 shrink-0"></div>
                <div class="px-6 pb-2 shrink-0">

                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                        </div>
                        <!-- 22-00 -->
                        <div class="grid grid-cols-[80px_repeat(14,1fr)] gap-1 mb-1">
                            <div class="h-10 bg-gray-100 rounded flex items-center justify-center"><div class="h-2 bg-gray-500 rounded w-10"></div></div>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                            <button class="h-10 bg-gray-200 rounded hover:bg-gray-300 transition-colors" onclick="toggleAvailabilityCell(this,false)"></button>
                        </div>
                    </div>
                </div>
                <div class="px-6 pb-6 pt-2 shrink-0">
                    <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeAvailabilityModal()">
                        <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL BOTTOM-SHEET: Confirmacion al deshabilitar celda con 🏆 -->
        <!-- Alerta: "Esta franja tiene torneo programado. ¿Deseas suspender?" -->
        <!-- ============================================================ -->
        <div id="availability-confirm-modal" class="absolute inset-0 z-[90] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="availability-confirm-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-64 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-72 mb-6 mx-auto"></div>
                <div class="flex gap-3">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeAvailabilityConfirm()">
                        <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                    </button>
                    <button class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="confirmAvailabilityToggle()">
                        <div class="h-4 bg-gray-400 rounded w-20 mx-auto"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL BOTTOM-SHEET: Confirmacion al deshabilitar cancha        -->
        <!-- Nota: Canchas deshabilitadas pasan torneos a SUSPENDED y       -->
        <!-- notifican a gestores (Sistema 11). NO se eliminan.             -->
        <!-- ============================================================ -->
        <div id="disable-court-modal" class="absolute inset-0 z-[90] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="disable-court-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-56 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-72 mb-6 mx-auto"></div>
                <div class="bg-gray-100 rounded-2xl p-4 mb-6 flex items-center gap-3">
                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center shrink-0">
                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                    </div>
                    <div class="flex-1">
                        <div class="h-3 bg-gray-800 rounded w-32 mb-1"></div>
                        <div class="h-2 bg-gray-300 rounded w-40"></div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeDisableCourtModal()">
                        <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                    </button>
                    <button class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="confirmDisableCourt()">
                        <div class="h-4 bg-gray-400 rounded w-24 mx-auto"></div>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT: Logica de Interaccion                                  -->
    <!-- ============================================================ -->
    <script>
        let courtToDisable = null;
        let pendingAvailabilityCell = null;
        let pendingAvailabilityIsTournament = false;

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';
                setTimeout(() => {
                    appLoading.style.display = 'none';
                    showToast('Panel de Administracion', '2 gestores activos • 2 canchas registradas');
                }, 500);
            }, 1200);
        });

        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            clearTimeout(window.toastTimeout);
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';
            window.toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }

        function selectUserForManager(id) {
            document.getElementById('manager-config-panel').classList.remove('hidden');
            document.getElementById('search-results').classList.add('hidden');
            showToast('Usuario seleccionado', 'Configurando permisos de gestor...');
        }

        function toggleManagerActive(btn) {
            const span = btn.querySelector('span');
            if (btn.classList.contains('bg-gray-800')) {
                btn.classList.remove('bg-gray-800');
                btn.classList.add('bg-gray-300');
                span.style.transform = 'translateX(-24px)';
            } else {
                btn.classList.add('bg-gray-800');
                btn.classList.remove('bg-gray-300');
                span.style.transform = 'translateX(0)';
            }
        }

        function saveManagerConfig() {
            showToast('Configuracion guardada', 'Permisos de gestor actualizados');
            document.getElementById('manager-config-panel').classList.add('hidden');
        }

        function openAddCourtModal() {
            openModal('court-modal', 'court-modal-content');
        }

        function editCourt(id) {
            openModal('court-modal', 'court-modal-content');
            showToast('Editar cancha', 'Cargando datos de cancha #' + id);
        }

        function saveCourt() {
            closeModal('court-modal', 'court-modal-content');
            showToast('Cancha guardada', 'Cancha registrada exitosamente');
        }

        function closeCourtModal() {
            closeModal('court-modal', 'court-modal-content');
        }

        function toggleCourtStatus(id) {
            courtToDisable = id;
            openModal('disable-court-modal', 'disable-court-content');
        }

        function closeDisableCourtModal() {
            closeModal('disable-court-modal', 'disable-court-content');
            courtToDisable = null;
        }

        function confirmDisableCourt() {
            closeModal('disable-court-modal', 'disable-court-content');
            setTimeout(() => {
                showToast('Cancha deshabilitada', 'Torneos afectados pasan a SUSPENDED. Notificacion enviada a gestores.');
                courtToDisable = null;
            }, 300);
        }

        function openCourtAvailability(id) {
            openModal('availability-modal', 'availability-modal-content');
        }

        function closeAvailabilityModal() {
            closeModal('availability-modal', 'availability-modal-content');
        }

        function toggleAvailabilityCell(cell, isCurrentlyUnavailable, hasTournament) {
            if (hasTournament && !isCurrentlyUnavailable) {
                pendingAvailabilityCell = cell;
                pendingAvailabilityIsTournament = true;
                openModal('availability-confirm-modal', 'availability-confirm-content');
                return;
            }
            if (isCurrentlyUnavailable) {
                cell.classList.remove('bg-gray-800', 'hover:bg-gray-700');
                cell.classList.add('bg-gray-200', 'hover:bg-gray-300');
            } else {
                cell.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                cell.classList.add('bg-gray-800', 'hover:bg-gray-700');
            }
        }

        function closeAvailabilityConfirm() {
            closeModal('availability-confirm-modal', 'availability-confirm-content');
            pendingAvailabilityCell = null;
            pendingAvailabilityIsTournament = false;
        }

        function confirmAvailabilityToggle() {
            closeModal('availability-confirm-modal', 'availability-confirm-content');
            if (pendingAvailabilityCell) {
                pendingAvailabilityCell.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                pendingAvailabilityCell.classList.add('bg-gray-800', 'hover:bg-gray-700');
                pendingAvailabilityCell = null;
                pendingAvailabilityIsTournament = false;
                showToast('Franja deshabilitada', 'Torneo programado suspendido');
            }
        }

        function showAdminNotifications() {
            showToast('Notificaciones', '3 notificaciones no leidas');
        }

        function showSystemAnnouncements() {
            showToast('Anuncios del sistema', 'Mostrando anuncios de familia SYSTEM');
        }

        function openModal(backdropId, contentId) {
            const modal = document.getElementById(backdropId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 10);
        }

        function closeModal(backdropId, contentId) {
            const modal = document.getElementById(backdropId);
            const content = document.getElementById(contentId);
            modal.style.opacity = '0';
            content.style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function setupSwipeModal(backdropId, contentId, closeFn) {
            let touchStartY = 0;
            const content = document.getElementById(contentId);
            if (content) {
                content.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });
                content.addEventListener('touchend', (e) => {
                    const touchEndY = e.changedTouches[0].clientY;
                    if (touchEndY - touchStartY > 80) {
                        closeFn();
                    }
                }, { passive: true });
            }
        }

        setupSwipeModal('court-modal', 'court-modal-content', closeCourtModal);
        setupSwipeModal('availability-modal', 'availability-modal-content', closeAvailabilityModal);
        setupSwipeModal('availability-confirm-modal', 'availability-confirm-content', closeAvailabilityConfirm);
        setupSwipeModal('disable-court-modal', 'disable-court-content', closeDisableCourtModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCourtModal();
                closeAvailabilityModal();
                closeAvailabilityConfirm();
                closeDisableCourtModal();
            }
        });
    </script>

</body>
</html>
