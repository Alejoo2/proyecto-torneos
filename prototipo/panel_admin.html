<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Admin — Wireframe Low-Fidelity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-[100dvh] flex items-center justify-center">

    <!-- ============================================================ -->
    <!-- APP SHELL: El "Móvil"                                          -->
    <!-- ============================================================ -->
    <!-- Intención: Admin NO usa navbar de jugador. Pantalla dedicada.   -->
    <div class="w-full max-w-lg min-h-[100dvh] bg-white md:min-h-[90vh] md:my-[5vh] md:rounded-[2rem] md:border-[10px] md:border-gray-900 md:shadow-2xl overflow-hidden flex flex-col relative">

        <!-- ============================================================ -->
        <!-- ESTADO DE CARGA INICIAL (Skeleton)                             -->
        <!-- ============================================================ -->
        <div id="app-loading" class="absolute inset-0 z-[60] bg-white flex flex-col transition-opacity duration-500">
            <!-- Skeleton del header -->
            <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-32 animate-pulse"></div>
                </div>
                <div class="w-14 h-6 bg-gray-200 rounded-full animate-pulse"></div>
            </div>
            <!-- Skeleton sección gestores -->
            <div class="px-6 pt-6">
                <div class="h-5 bg-gray-200 rounded w-32 animate-pulse mb-6"></div>
                <div class="bg-gray-100 rounded-2xl p-5 h-48 animate-pulse mb-6"></div>
                <div class="space-y-3">
                    <div class="bg-gray-100 rounded-2xl p-4 h-16 animate-pulse"></div>
                    <div class="bg-gray-100 rounded-2xl p-4 h-16 animate-pulse"></div>
                    <div class="bg-gray-100 rounded-2xl p-4 h-16 animate-pulse"></div>
                </div>
            </div>
            <!-- Skeleton divisor -->
            <div class="h-px bg-gray-200 mx-6 my-8 animate-pulse"></div>
            <!-- Skeleton sección canchas -->
            <div class="px-6">
                <div class="h-5 bg-gray-200 rounded w-24 animate-pulse mb-6"></div>
                <div class="bg-gray-200 rounded-2xl h-14 animate-pulse mb-6"></div>
                <div class="space-y-3">
                    <div class="bg-gray-100 rounded-2xl p-4 h-24 animate-pulse"></div>
                    <div class="bg-gray-100 rounded-2xl p-4 h-24 animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- HEADER: Sticky con badge de rol Admin                          -->
        <!-- ============================================================ -->
        <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-3">
                    <a href="hub_mapa_principal.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 active:bg-gray-200 transition-colors min-w-[44px] min-h-[44px]" aria-label="Volver al inicio">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div class="h-4 bg-gray-800 rounded w-32"></div>
                </div>
                <div class="bg-gray-800 text-white px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                    <div class="h-2 bg-gray-400 rounded w-10"></div>
                </div>
            </div>
        </header>

        <!-- ============================================================ -->
        <!-- CONTENIDO PRINCIPAL                                            -->
        <!-- ============================================================ -->
        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden pb-8 opacity-0 transition-opacity duration-500">

            <!-- ============================================================ -->
            <!-- SECCIÓN 1: GESTORES                                            -->
            <!-- ============================================================ -->
            <div class="px-6 pt-6 mb-8">
                <div class="h-5 bg-gray-800 rounded w-32 mb-6"></div>

                <!-- Formulario: Crear Gestor -->
                <div class="bg-gray-100 rounded-2xl p-5 mb-6">
                    <div class="h-4 bg-gray-800 rounded w-40 mb-4"></div>

                    <form class="space-y-4" onsubmit="event.preventDefault(); crearGestor();">
                        <!-- Nombre -->
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-400 rounded w-16"></div>
                            <div class="w-full h-14 bg-white rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                                <div class="h-3 bg-gray-300 rounded w-32"></div>
                            </div>
                        </div>
                        <!-- Email -->
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-400 rounded w-12"></div>
                            <div class="w-full h-14 bg-white rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                                <div class="h-3 bg-gray-300 rounded w-40"></div>
                            </div>
                        </div>
                        <!-- Contraseña -->
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-400 rounded w-24"></div>
                            <div class="w-full h-14 bg-white rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                                <div class="h-3 bg-gray-300 rounded w-28"></div>
                            </div>
                        </div>
                        <!-- Botón Crear -->
                        <button type="submit" class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 mt-2 min-h-[56px] relative overflow-hidden">
                            <div class="h-4 bg-gray-400 rounded w-28 mx-auto"></div>
                            <span class="absolute inset-0 bg-white/20 scale-0 rounded-2xl transition-transform duration-300" id="ripple-crear-gestor"></span>
                        </button>
                    </form>
                </div>

                <!-- Lista de Gestores Existentes -->
                <div>
                    <div class="h-4 bg-gray-800 rounded w-40 mb-4"></div>
                    <div class="space-y-3" id="lista-gestores">
                        <!-- Gestor 1 -->
                        <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                            <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-28 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-40"></div>
                            </div>
                            <div class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1.5">
                                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
                                <div class="h-2 bg-gray-400 rounded w-12"></div>
                            </div>
                            <!-- Acciones -->
                            <div class="flex items-center gap-1 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarGestor(1)" aria-label="Editar gestor">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                        <!-- Gestor 2 -->
                        <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                            <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-24 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-36"></div>
                            </div>
                            <div class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1.5">
                                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
                                <div class="h-2 bg-gray-400 rounded w-12"></div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarGestor(2)" aria-label="Editar gestor">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                        <!-- Gestor 3 -->
                        <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                            <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-32 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-44"></div>
                            </div>
                            <div class="bg-gray-300 text-gray-500 text-xs px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1.5">
                                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
                                <div class="h-2 bg-gray-400 rounded w-14"></div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarGestor(3)" aria-label="Editar gestor">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Divisor -->
            <div class="h-px bg-gray-200 mx-6 mb-8"></div>

            <!-- ============================================================ -->
            <!-- SECCIÓN 2: CANCHAS                                             -->
            <!-- ============================================================ -->
            <div class="px-6 mb-8">
                <div class="h-5 bg-gray-800 rounded w-24 mb-6"></div>

                <!-- Botón Añadir Cancha -->
                <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 mb-6 shadow-lg flex items-center justify-center gap-3 min-h-[56px] relative overflow-hidden" onclick="abrirFormCancha()">
                    <div class="w-6 h-6 bg-gray-400 rounded"></div>
                    <div class="h-4 bg-gray-400 rounded w-32"></div>
                    <span class="absolute inset-0 bg-white/20 scale-0 rounded-2xl transition-transform duration-300" id="ripple-add-cancha"></span>
                </button>

                <!-- Lista de Canchas Existentes -->
                <div class="space-y-3" id="lista-canchas">
                    <!-- Cancha 1 -->
                    <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                        <div class="flex items-start gap-4">
                            <a href="detalle_cancha_sede.html" class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 hover:bg-gray-300 active:bg-gray-400 transition-colors min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </a>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-32 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-2/3 mb-3"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-10"></div>
                                    </div>
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-12"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Acciones: Editar / Eliminar -->
                            <div class="flex items-center gap-2 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarCancha(1)" aria-label="Editar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                                <button class="w-10 h-10 bg-white hover:bg-red-50 active:bg-red-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="eliminarCancha(1)" aria-label="Eliminar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Cancha 2 -->
                    <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                        <div class="flex items-start gap-4">
                            <a href="detalle_cancha_sede.html" class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 hover:bg-gray-300 active:bg-gray-400 transition-colors min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </a>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-28 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-3/4 mb-3"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-12"></div>
                                    </div>
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-10"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarCancha(2)" aria-label="Editar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                                <button class="w-10 h-10 bg-white hover:bg-red-50 active:bg-red-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="eliminarCancha(2)" aria-label="Eliminar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Cancha 3 -->
                    <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                        <div class="flex items-start gap-4">
                            <a href="detalle_cancha_sede.html" class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 hover:bg-gray-300 active:bg-gray-400 transition-colors min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </a>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-36 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-1/2 mb-3"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-10"></div>
                                    </div>
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-14"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarCancha(3)" aria-label="Editar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                                <button class="w-10 h-10 bg-white hover:bg-red-50 active:bg-red-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="eliminarCancha(3)" aria-label="Eliminar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Cancha 4 -->
                    <div class="bg-gray-100 rounded-2xl p-4 hover:bg-gray-200 active:bg-gray-300 transition-colors">
                        <div class="flex items-start gap-4">
                            <a href="detalle_cancha_sede.html" class="w-16 h-16 bg-gray-200 rounded-xl flex items-center justify-center shrink-0 hover:bg-gray-300 active:bg-gray-400 transition-colors min-w-[64px] min-h-[64px]">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </a>
                            <div class="flex-1 min-w-0">
                                <div class="h-3 bg-gray-800 rounded w-30 mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                                <div class="h-2 bg-gray-300 rounded w-2/3 mb-3"></div>
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-12"></div>
                                    </div>
                                    <div class="bg-gray-200 px-2 py-1 rounded-lg">
                                        <div class="h-2 bg-gray-400 rounded w-10"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <button class="w-10 h-10 bg-white hover:bg-gray-50 active:bg-gray-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="editarCancha(4)" aria-label="Editar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                                <button class="w-10 h-10 bg-white hover:bg-red-50 active:bg-red-100 rounded-xl flex items-center justify-center transition-colors shadow-sm min-h-[44px]" onclick="eliminarCancha(4)" aria-label="Eliminar cancha">
                                    <div class="w-5 h-5 bg-gray-300 rounded"></div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- NOTIFICACIÓN CONTEXTUAL INFERIOR                               -->
            <!-- ============================================================ -->
            <div class="px-6 mb-8">
                <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3 hover:bg-gray-200 active:bg-gray-300 transition-colors cursor-pointer" onclick="showAdminInfo()">
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                        <div class="w-5 h-5 bg-gray-400 rounded"></div>
                    </div>
                    <div class="flex-1">
                        <div class="h-3 bg-gray-600 rounded w-48 mb-1"></div>
                        <div class="h-2 bg-gray-300 rounded w-32"></div>
                    </div>
                    <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </div>

        </main>

        <!-- ============================================================ -->
        <!-- SIN NAVBAR INFERIOR (Admin no usa navegación de jugador)       -->
        <!-- ============================================================ -->

        <!-- ============================================================ -->
        <!-- TOAST DE NOTIFICACIÓN                                          -->
        <!-- ============================================================ -->
        <div id="toast" class="absolute top-20 left-4 right-4 z-[70] pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
            <div class="bg-gray-800 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center shrink-0">
                    <div class="w-4 h-4 bg-gray-400 rounded"></div>
                </div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-400 rounded w-3/4 mb-1" id="toast-title"></div>
                    <div class="h-2 bg-gray-500 rounded w-1/2" id="toast-subtitle"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL DE FORMULARIO CANCHA (Crear/Editar)                      -->
        <!-- ============================================================ -->
        <div id="cancha-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="cancha-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                
                <form class="space-y-4 mb-6" onsubmit="event.preventDefault(); guardarCancha();">
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-20"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-32"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-16"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-40"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="h-3 bg-gray-400 rounded w-24"></div>
                        <div class="w-full h-14 bg-gray-100 rounded-xl border-2 border-gray-200 flex items-center px-4 hover:border-gray-300 focus-within:border-gray-400 transition-colors">
                            <div class="h-3 bg-gray-300 rounded w-28"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px] relative overflow-hidden">
                        <div class="h-4 bg-gray-400 rounded w-24 mx-auto"></div>
                        <span class="absolute inset-0 bg-white/20 scale-0 rounded-2xl transition-transform duration-300" id="ripple-guardar-cancha"></span>
                    </button>
                </form>

                <button class="w-full bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeCanchaModal()">
                    <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                </button>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL DE CONFIRMACIÓN ELIMINAR                                 -->
        <!-- ============================================================ -->
        <div id="eliminar-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="eliminar-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                
                <div class="bg-gray-100 rounded-2xl p-4 mb-6 flex items-center gap-3">
                    <div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center shrink-0">
                        <div class="w-6 h-6 bg-gray-300 rounded-lg"></div>
                    </div>
                    <div class="flex-1">
                        <div class="h-3 bg-gray-800 rounded w-32 mb-1"></div>
                        <div class="h-2 bg-gray-300 rounded w-40"></div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button class="flex-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeEliminarModal()">
                        <div class="h-4 bg-gray-400 rounded w-20 mx-auto"></div>
                    </button>
                    <button class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="confirmarEliminar()">
                        <div class="h-4 bg-gray-400 rounded w-24 mx-auto"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL DE INFO ADMIN                                            -->
        <!-- ============================================================ -->
        <div id="info-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="info-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                
                <div class="space-y-3 mb-6">
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-48 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-32"></div>
                        </div>
                    </div>
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-40 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-28"></div>
                        </div>
                    </div>
                </div>

                <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeInfoModal()">
                    <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT: Lógica de Interacción                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ESTADO
        // ============================================================
        let canchaAEliminar = null;
        let canchaEnEdicion = null;

        // ============================================================
        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                
                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';
                
                setTimeout(() => {
                    appLoading.style.display = 'none';
                    showToast('Panel de Administración', '3 gestores activos • 4 canchas registradas');
                }, 500);
            }, 1200);
        });

        // ============================================================
        // GESTORES
        // ============================================================
        function crearGestor() {
            const ripple = document.getElementById('ripple-crear-gestor');
            ripple.style.transform = 'scale(1)';
            setTimeout(() => ripple.style.transform = 'scale(0)', 300);

            if (navigator.vibrate) navigator.vibrate(50);

            setTimeout(() => {
                showToast('Gestor creado', 'Nuevo gestor registrado exitosamente');
            }, 300);
        }

        function editarGestor(id) {
            if (navigator.vibrate) navigator.vibrate(20);
            showToast('Editar gestor', `Abriendo editor del gestor #${id}...`);
        }

        // ============================================================
        // CANCHAS
        // ============================================================
        function abrirFormCancha() {
            canchaEnEdicion = null;
            const ripple = document.getElementById('ripple-add-cancha');
            ripple.style.transform = 'scale(1)';
            setTimeout(() => ripple.style.transform = 'scale(0)', 300);

            if (navigator.vibrate) navigator.vibrate(30);

            const modal = document.getElementById('cancha-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('cancha-modal-content').style.transform = 'translateY(0)';
            }, 10);
        }

        function editarCancha(id) {
            canchaEnEdicion = id;
            if (navigator.vibrate) navigator.vibrate(20);

            const modal = document.getElementById('cancha-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('cancha-modal-content').style.transform = 'translateY(0)';
            }, 10);
        }

        function guardarCancha() {
            const ripple = document.getElementById('ripple-guardar-cancha');
            ripple.style.transform = 'scale(1)';
            setTimeout(() => ripple.style.transform = 'scale(0)', 300);

            closeCanchaModal();

            if (canchaEnEdicion) {
                showToast('Cancha actualizada', `Cancha #${canchaEnEdicion} modificada exitosamente`);
            } else {
                showToast('Cancha creada', 'Nueva cancha registrada en el sistema');
            }
            canchaEnEdicion = null;
        }

        function closeCanchaModal() {
            const modal = document.getElementById('cancha-modal');
            modal.style.opacity = '0';
            document.getElementById('cancha-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function eliminarCancha(id) {
            canchaAEliminar = id;
            if (navigator.vibrate) navigator.vibrate([20, 10, 20]);

            const modal = document.getElementById('eliminar-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('eliminar-modal-content').style.transform = 'translateY(0)';
            }, 10);
        }

        function closeEliminarModal() {
            const modal = document.getElementById('eliminar-modal');
            modal.style.opacity = '0';
            document.getElementById('eliminar-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
            canchaAEliminar = null;
        }

        function confirmarEliminar() {
            closeEliminarModal();
            setTimeout(() => {
                showToast('Cancha eliminada', `Cancha #${canchaAEliminar} removida del sistema`);
                canchaAEliminar = null;
            }, 300);
        }

        // ============================================================
        // INFO ADMIN
        // ============================================================
        function showAdminInfo() {
            const modal = document.getElementById('info-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('info-modal-content').style.transform = 'translateY(0)';
            }, 10);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function closeInfoModal() {
            const modal = document.getElementById('info-modal');
            modal.style.opacity = '0';
            document.getElementById('info-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            
            clearTimeout(toastTimeout);
            
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            
            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';
            
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }

        // ============================================================
        // TECLADO (Escape para cerrar modales)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCanchaModal();
                closeEliminarModal();
                closeInfoModal();
            }
        });

        // ============================================================
        // SWIPE PARA CERRAR MODALES
        // ============================================================
        function setupSwipeModal(contentId, closeFn) {
            let touchStartY = 0;
            const content = document.getElementById(contentId);
            
            if (content) {
                content.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                content.addEventListener('touchend', (e) => {
                    const touchEndY = e.changedTouches[0].clientY;
                    if (touchEndY - touchStartY > 80) {
                        closeFn();
                    }
                }, { passive: true });
            }
        }

        setupSwipeModal('cancha-modal-content', closeCanchaModal);
        setupSwipeModal('eliminar-modal-content', closeEliminarModal);
        setupSwipeModal('info-modal-content', closeInfoModal);
    </script>

</body>
</html>
