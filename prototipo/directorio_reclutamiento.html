            { 
                id: 'player_7', 
                name: 'Lucía Martínez', 
                availabilitySummary: 'Sáb (todo el día)', 
                teamCount: 5, 
                maxTeams: 15,
                avatar: null,
                isInvited: false
            },
            { 
                id: 'player_8', 
                name: 'Mateo Gómez', 
                availabilitySummary: 'Lun, Mié, Vie, Dom', 
                teamCount: 15, 
                maxTeams: 15,
                avatar: null,
                isInvited: false
            },
        ];

        // ============================================================
        // ESTADO
        // ============================================================
        let currentFilter = 'todos';
        let searchQuery = '';
        let selectedPlayer = null;
        let selectedDays = [];
        let selectedSlots = [];

        // ============================================================
        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderPlayers();
            
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                
                appLoading.classList.add('opacity-0');
                mainContent.classList.remove('opacity-0');
                
                setTimeout(() => {
                    appLoading.classList.add('hidden');
                    showToast('Directorio cargado', `${getVisiblePlayers().length} jugadores disponibles`);
                }, 500);
            }, 1000);
        });

        // ============================================================
        // FILTRADO: Jugadores visibles (excluye los con 15 equipos)
        // ============================================================
        function getVisiblePlayers() {
            return players.filter(p => p.teamCount < p.maxTeams);
        }

        // ============================================================
        // RENDERIZAR JUGADORES
        // ============================================================
        function renderPlayers() {
            const list = document.getElementById('players-list');
            const emptyState = document.getElementById('empty-state');
            
            let visible = getVisiblePlayers();

            // Filtrar por búsqueda
            if (searchQuery) {
                visible = visible.filter(p => 
                    p.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }

            // Filtrar por disponibilidad (si hay selección)
            if (selectedDays.length > 0 || selectedSlots.length > 0) {
                visible = visible.filter(p => {
                    const matchesDay = selectedDays.length === 0 || selectedDays.some(day => 
                        p.availabilitySummary.toLowerCase().includes(day) ||
                        p.availabilitySummary.toLowerCase().includes('todos')
                    );
                    // Mock: en implementación real se filtraría por franja
                    return matchesDay;
                });
            }

            if (visible.length === 0) {
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            list.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const isTeamFull = TEAM_CONFIG.currentMembers >= TEAM_CONFIG.maxMembers;

            list.innerHTML = visible.map(player => {
                const isInvited = player.isInvited;
                const isPlayerFull = player.teamCount >= player.maxTeams;
                const buttonDisabled = isTeamFull || isInvited;
                
                return `
                <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-4 transition-all duration-200">
                    <!-- Avatar -->
                    <a href="perfil_jugador.html?id=${player.id}" class="w-14 h-14 bg-gray-200 rounded-full flex items-center justify-center shrink-0 hover:scale-105 transition-transform overflow-hidden">
                        ${player.avatar 
                            ? `<img src="${player.avatar}" alt="${player.name}" class="w-full h-full object-cover">`
                            : `<svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                               </svg>`
                        }
                    </a>
                    
                    <!-- Info -->
                    <a href="perfil_jugador.html?id=${player.id}" class="flex-1 min-w-0">
                        <div class="h-3 bg-gray-800 rounded w-${Math.min(player.name.length * 2, 40)} mb-1.5"></div>
                        <div class="flex items-center gap-1.5 mb-1">
                            <svg class="w-3 h-3 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <div class="h-2 bg-gray-400 rounded w-${Math.min(player.availabilitySummary.length * 3, 48)}"></div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <svg class="w-3 h-3 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                            <div class="h-2 bg-gray-400 rounded w-12"></div>
                        </div>
                    </a>
                    
                    <!-- Acciones -->
                    <div class="flex gap-2 shrink-0">
                        <a href="perfil_jugador.html?id=${player.id}" class="bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-medium hover:bg-gray-50 active:bg-gray-100 transition-colors min-h-[40px] flex items-center">
                            Ver perfil
                        </a>
                        ${isInvited 
                            ? `<button disabled class="bg-gray-300 text-white px-4 py-2 rounded-xl text-xs font-medium cursor-not-allowed min-h-[40px] flex items-center" title="Invitación pendiente">
                                Invitado
                               </button>`
                            : `<button 
                                ${buttonDisabled ? 'disabled' : ''}
                                class="${buttonDisabled ? 'bg-gray-300 text-white cursor-not-allowed' : 'bg-gray-800 text-white hover:bg-gray-700 active:bg-gray-900'} px-4 py-2 rounded-xl text-xs font-medium transition-colors min-h-[40px] flex items-center"
                                ${!buttonDisabled ? `onclick="openInviteModal('${player.id}')"` : ''}
                                title="${isTeamFull ? 'Tu equipo ya tiene 15 miembros' : ''}"
                               >
                                Invitar
                               </button>`
                        }
                    </div>
                </div>
            `}).join('');
        }

        // ============================================================
        // BÚSQUEDA
        // ============================================================
        function handleSearch(value) {
            searchQuery = value;
            renderPlayers();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            renderPlayers();
        }

        // ============================================================
        // FILTROS
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            
            const btnTodos = document.getElementById('filter-todos');
            const btnDisp = document.getElementById('filter-disponibilidad');
            
            if (filter === 'todos') {
                btnTodos.classList.remove('bg-gray-100', 'text-gray-600');
                btnTodos.classList.add('bg-gray-800', 'text-white');
                btnDisp.classList.remove('bg-gray-800', 'text-white');
                btnDisp.classList.add('bg-gray-100', 'text-gray-600');
                // Cerrar panel de disponibilidad
                document.getElementById('availability-panel').classList.add('hidden');
            }
            
            renderPlayers();
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function toggleAvailabilityFilter() {
            const panel = document.getElementById('availability-panel');
            const btnTodos = document.getElementById('filter-todos');
            const btnDisp = document.getElementById('filter-disponibilidad');
            
            panel.classList.toggle('hidden');
            
            if (!panel.classList.contains('hidden')) {
                btnDisp.classList.remove('bg-gray-100', 'text-gray-600');
                btnDisp.classList.add('bg-gray-800', 'text-white');
                btnTodos.classList.remove('bg-gray-800', 'text-white');
                btnTodos.classList.add('bg-gray-100', 'text-gray-600');
                currentFilter = 'disponibilidad';
            } else {
                btnDisp.classList.remove('bg-gray-800', 'text-white');
                btnDisp.classList.add('bg-gray-100', 'text-gray-600');
                btnTodos.classList.remove('bg-gray-100', 'text-gray-600');
                btnTodos.classList.add('bg-gray-800', 'text-white');
                currentFilter = 'todos';
                selectedDays = [];
                selectedSlots = [];
                renderPlayers();
            }
            
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function toggleDay(btn) {
            const day = btn.dataset.day;
            if (selectedDays.includes(day)) {
                selectedDays = selectedDays.filter(d => d !== day);
                btn.classList.remove('bg-gray-800', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            } else {
                selectedDays.push(day);
                btn.classList.remove('bg-gray-100', 'text-gray-600');
                btn.classList.add('bg-gray-800', 'text-white');
            }
            renderPlayers();
        }

        function toggleSlot(btn) {
            const slot = btn.dataset.slot;
            if (selectedSlots.includes(slot)) {
                selectedSlots = selectedSlots.filter(s => s !== slot);
                btn.classList.remove('bg-gray-800', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            } else {
                selectedSlots.push(slot);
                btn.classList.remove('bg-gray-100', 'text-gray-600');
                btn.classList.add('bg-gray-800', 'text-white');
            }
            renderPlayers();
        }

        function clearAvailabilityFilter() {
            selectedDays = [];
            selectedSlots = [];
            document.querySelectorAll('.day-btn, .slot-btn').forEach(btn => {
                btn.classList.remove('bg-gray-800', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            renderPlayers();
        }

        // ============================================================
        // MODAL DE INVITACIÓN
        // ============================================================
        function openInviteModal(playerId) {
            selectedPlayer = players.find(p => p.id === playerId);
            if (!selectedPlayer) return;
            
            const modal = document.getElementById('invite-modal');
            
            // Poblar datos del modal
            document.getElementById('modal-name').style.width = Math.min(selectedPlayer.name.length * 8, 200) + 'px';
            document.getElementById('modal-availability').style.width = Math.min(selectedPlayer.availabilitySummary.length * 6, 180) + 'px';
            document.getElementById('modal-team-count').style.width = (selectedPlayer.teamCount.toString().length * 8 + 40) + 'px';
            
            // Advertencia si >= 12 equipos
            const warningEl = document.getElementById('modal-warning');
            if (selectedPlayer.teamCount >= 12) {
                warningEl.classList.remove('hidden');
            } else {
                warningEl.classList.add('hidden');
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('translate-y-full');
            }, 10);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function closeInviteModal() {
            const modal = document.getElementById('invite-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
            selectedPlayer = null;
        }

        function confirmInvite() {
            if (!selectedPlayer) return;
            
            // Optimistic UI: marcar como invitado inmediatamente
            selectedPlayer.isInvited = true;
            
            closeInviteModal();
            
            setTimeout(() => {
                renderPlayers();
                showToast('Invitación enviada', `Invitación enviada a ${selectedPlayer.name}`);
            }, 300);
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            
            clearTimeout(toastTimeout);
            
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            
            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-95', 'translate-y-0');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-95', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 3000);
        }

        // ============================================================
        // TECLADO (Escape para cerrar modal)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeInviteModal();
        });
    </script>

</body>
</html>
