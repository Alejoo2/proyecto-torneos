<!DOCTYPE html>

                                <div class="h-3 bg-gray-200 rounded w-32 animate-pulse"></div>

                            <div class="h-2 bg-gray-200 rounded w-full animate-pulse"></div>
                            <div class="h-2 bg-gray-200 rounded w-2/3 animate-pulse"></div>
                            <div class="h-8 bg-gray-200 rounded-xl w-24 animate-pulse mt-2"></div>

                                <div class="h-3 bg-gray-200 rounded w-32 animate-pulse"></div>
                            </div>
                            <div class="h-2 bg-gray-200 rounded w-full animate-pulse"></div>
                            <div class="h-2 bg-gray-200 rounded w-2/3 animate-pulse"></div>
                            <div class="h-8 bg-gray-200 rounded-xl w-24 animate-pulse mt-2"></div>

                    <button id="tab-btn-inscripciones" class="flex-1 bg-gray-800 text-white py-3 rounded-xl text-sm font-medium transition-all duration-200 min-h-[44px] relative overflow-hidden" role="tab" aria-selected="true" aria-controls="tab-inscripciones" onclick="switchTab('inscripciones')">

                        <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-inscripciones"></span>
                    </button>
                    <!-- Tab 2: Sorteo -->

                        <div class="h-3 bg-gray-300 rounded w-20 mx-auto"></div>
                    </a>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- TAB 1: INSCRIPCIONES                                           -->
            <!-- ============================================================ -->

                <!-- Header de sección -->
                <div class="flex items-center justify-between mb-2">
                    <div class="h-4 bg-gray-800 rounded w-48"></div>
                    <div class="h-3 bg-gray-400 rounded w-12"></div>
                </div>

                <!-- ============================================================ -->
                <!-- CASO A: Horario cuadra — APROBABLE                             -->
                <!-- ============================================================ -->
                <div class="bg-white border-2 border-gray-300 rounded-2xl p-4 hover:border-gray-400 active:border-gray-500 transition-colors">
                    <div class="flex items-start gap-4">
                        <!-- Mini Card Maestra -->
                        <a href="detalle_equipo_card_maestra.html" class="shrink-0 group cursor-pointer min-w-[44px] min-h-[44px]">
                            <div class="w-14 h-14 bg-gray-200 rounded-xl mb-2 flex items-center justify-center group-hover:bg-gray-300 group-active:bg-gray-400 transition-colors">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg group-hover:bg-gray-400 transition-colors"></div>
                            </div>
                            <div class="h-2 bg-gray-600 rounded w-14 mx-auto group-hover:bg-gray-700 transition-colors"></div>

                                <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-aprobar-1"></span>
                            </button>

                <!-- CASO A (otro): Horario cuadra — APROBABLE                      -->

                    <div class="flex items-start gap-4">

                            <div class="h-2 bg-gray-600 rounded w-12 mx-auto group-hover:bg-gray-700 transition-colors"></div>
                        </a>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-5 h-5 bg-gray-300 rounded-full flex items-center justify-center shrink-0">
                                    <svg class="w-3 h-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                    </svg>
                                </div>
                                <div class="h-3 bg-gray-400 rounded w-28"></div>
                            </div>

                            <div class="h-2 bg-gray-300 rounded w-3/4 mb-3"></div>

                                <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-aprobar-2"></span>

                    <!-- Sello de conflicto -->
                    <div class="absolute top-3 right-3 bg-gray-200 text-gray-400 px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5">
                        <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                        <div class="h-2 bg-gray-400 rounded w-20"></div>
                    </div>

                    <div class="flex items-start gap-4">
                        <!-- Mini Card Maestra (no clickeable en conflicto) -->
                        <div class="shrink-0">
                            <div class="w-14 h-14 bg-gray-200 rounded-xl mb-2 flex items-center justify-center">
                                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                            </div>
                            <div class="h-2 bg-gray-300 rounded w-16 mx-auto"></div>
                        </div>
                        <!-- Info y acción bloqueada -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-5 h-5 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                                    <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>

                            </div>

                                <div class="h-3 bg-gray-300 rounded w-16 mx-auto"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ============================================================ -->
                <!-- CASO A (otro): Horario cuadra — APROBABLE                      -->
                <!-- ============================================================ -->
                <div class="bg-white border-2 border-gray-300 rounded-2xl p-4 hover:border-gray-400 active:border-gray-500 transition-colors">
                    <div class="flex items-start gap-4">
                        <a href="detalle_equipo_card_maestra.html" class="shrink-0 group cursor-pointer min-w-[44px] min-h-[44px]">

                            <div class="flex items-center gap-2 mb-2">

                                    <svg class="w-3 h-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                    </svg>
                                </div>
                                <div class="h-3 bg-gray-400 rounded w-24"></div>
                            </div>
                            <div class="h-2 bg-gray-300 rounded w-full mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-2/3 mb-3"></div>
                            <button class="bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 min-h-[44px] relative overflow-hidden" onclick="aprobarInscripcion(this, 'Real Cartagena')">
                                <div class="h-3 bg-gray-400 rounded w-16 mx-auto"></div>
                                <span class="absolute inset-0 bg-white/20 scale-0 rounded-xl transition-transform duration-300" id="ripple-aprobar-3"></span>
                            </button>

                    </div>

            <!-- TAB 2: SORTEO GRÁFICO (Placeholder)                            -->

            <div id="tab-sorteo" class="px-6 pt-4 hidden" role="tabpanel" aria-labelledby="tab-btn-sorteo">
                <div class="text-center py-12">
                    <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    </div>
                    <div class="h-4 bg-gray-800 rounded w-40 mx-auto mb-2"></div>

                <div class="text-center py-12">
                    <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    </div>
                    <div class="h-4 bg-gray-800 rounded w-40 mx-auto mb-2"></div>
                    <div class="h-3 bg-gray-300 rounded w-56 mx-auto"></div>
                </div>
            </div>

            <!-- ============================================================ -->

                        <div class="w-5 h-5 bg-gray-400 rounded"></div>

                    <div class="flex-1">
                        <div class="h-3 bg-gray-600 rounded w-56 mb-1"></div>

                    </div>
                    <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </div>

        </main>

        <!-- NAVBAR INFERIOR                                                -->
        <!-- ============================================================ -->
        <nav class="absolute bottom-0 w-full z-50 bg-white border-t border-gray-200" style="padding-bottom: env(safe-area-inset-bottom);">
            <div class="grid grid-cols-4 h-16">
                <a href="hub_mapa_principal.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-600 active:text-gray-800 transition-colors min-h-[44px]" aria-label="Inicio">

                <a href="detalle_torneo.html" class="flex flex-col items-center justify-center gap-1 text-gray-800 min-h-[44px]" aria-label="Torneos">

                <a href="perfil_jugador.html" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-gray-600 active:text-gray-800 transition-colors min-h-[44px]" aria-label="Perfil">
                    <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
                    <div class="h-2 bg-gray-300 rounded w-10"></div>
                </a>
            </div>
        </nav>

        <!-- ============================================================ -->
        <!-- TOAST DE NOTIFICACIÓN                                          -->
        <!-- ============================================================ -->
        <div id="toast" class="absolute top-20 left-4 right-4 z-[70] pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
            <div class="bg-gray-800 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center shrink-0">
                    <div class="w-4 h-4 bg-gray-400 rounded"></div>
                </div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-400 rounded w-3/4 mb-1" id="toast-title"></div>
                    <div class="h-2 bg-gray-500 rounded w-1/2" id="toast-subtitle"></div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- MODAL DE DETALLE DE CONFLICTO                                  -->
        <!-- ============================================================ -->
        <div id="conflict-modal" class="absolute inset-0 z-[80] bg-gray-950/60 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-t-3xl p-6 w-full transform translate-y-full transition-transform duration-300" id="conflict-modal-content">
                <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <div class="h-4 bg-gray-800 rounded w-48 mb-2 mx-auto"></div>
                <div class="h-3 bg-gray-300 rounded w-64 mb-6 mx-auto"></div>
                
                <div class="space-y-3 mb-6">
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-40 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-32"></div>
                        </div>
                    </div>
                    <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center shrink-0">
                            <div class="w-5 h-5 bg-gray-400 rounded"></div>
                        </div>
                        <div class="flex-1">
                            <div class="h-3 bg-gray-800 rounded w-36 mb-1"></div>
                            <div class="h-2 bg-gray-300 rounded w-28"></div>
                        </div>
                    </div>
                </div>

                <button class="w-full bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-4 rounded-2xl font-medium transition-all duration-200 min-h-[56px]" onclick="closeConflictModal()">
                    <div class="h-4 bg-gray-400 rounded w-16 mx-auto"></div>
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT: Lógica de Interacción                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ESTADO
        // ============================================================
        let inscripcionesAprobadas = new Set();

        // ============================================================
        // CARGA INICIAL
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const appLoading = document.getElementById('app-loading');
                const mainContent = document.getElementById('main-content');
                
                appLoading.style.opacity = '0';
                mainContent.style.opacity = '1';
                
                setTimeout(() => {
                    appLoading.style.display = 'none';
                    showToast('Gestión de inscripciones', '5 solicitudes pendientes • 2 conflictos detectados');
                }, 500);
            }, 1200);
        });

        // ============================================================
        // NAVEGACIÓN DE TABS
        // ============================================================
        function switchTab(tabName) {
            // Las tabs Sorteo y Planilla navegan por href (links reales)
            // Esta función solo maneja el estado visual de la tab activa
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // ============================================================
        // APROBAR INSCRIPCIÓN
        // ============================================================
        function aprobarInscripcion(btn, equipoNombre) {
            if (inscripcionesAprobadas.has(equipoNombre)) {
                showToast('Ya aprobado', `${equipoNombre} ya está inscrito en el torneo`);
                return;
            }

            // Ripple effect
            const rippleId = btn.querySelector('span')?.id;
            if (rippleId) {
                const ripple = document.getElementById(rippleId);
                ripple.style.transform = 'scale(1)';
                setTimeout(() => ripple.style.transform = 'scale(0)', 300);
            }

            // Feedback táctil
            if (navigator.vibrate) navigator.vibrate(50);

            // Transición visual del botón
            btn.classList.remove('bg-gray-800', 'hover:bg-gray-700', 'active:bg-gray-900');
            btn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');
            btn.querySelector('div').style.width = '20px';
            btn.querySelector('div').style.margin = '0 auto';

            inscripcionesAprobadas.add(equipoNombre);

            setTimeout(() => {
                showToast('Inscripción aprobada', `${equipoNombre} ahora participa en el torneo`);
            }, 300);
        }

        // ============================================================
        // DETALLE DE CONFLICTOS
        // ============================================================
        function showConflictDetail() {
            const modal = document.getElementById('conflict-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.style.opacity = '1';
                document.getElementById('conflict-modal-content').style.transform = 'translateY(0)';
            }, 10);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function closeConflictModal() {
            const modal = document.getElementById('conflict-modal');
            modal.style.opacity = '0';
            document.getElementById('conflict-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // ============================================================
        // SISTEMA DE TOAST
        // ============================================================
        let toastTimeout;
        function showToast(title, subtitle) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastSubtitle = document.getElementById('toast-subtitle');
            
            clearTimeout(toastTimeout);
            
            toastTitle.style.width = Math.min(title.length * 8, 200) + 'px';
            toastSubtitle.style.width = Math.min(subtitle.length * 6, 150) + 'px';
            
            toast.style.opacity = '0.95';
            toast.style.transform = 'translateY(0)';
            
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-8px)';
            }, 3000);
        }

        // ============================================================
        // TECLADO (Escape para cerrar modal)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeConflictModal();
        });

        // ============================================================
        // SWIPE PARA CERRAR MODAL
        // ============================================================
        let touchStartY = 0;
        const conflictModalContent = document.getElementById('conflict-modal-content');
        
        if (conflictModalContent) {
            conflictModalContent.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            conflictModalContent.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                if (touchEndY - touchStartY > 80) {
                    closeConflictModal();
                }
            }, { passive: true });
        }
    </script>

</body>
</html>
